<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="Deep Strike: a retro one-on-one arcade fighter set in caves, crystal grottos and boreholes.">
<meta name="theme-color" content="#07060a">
<title>Deep Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kaushan+Script&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
html.touch #touch{display:block}
#pad{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);pointer-events:none}
.b{position:absolute;width:62px;height:62px;border-radius:50%;pointer-events:auto;touch-action:none;font:10px "Chakra Petch",sans-serif;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);text-shadow:0 1px 0 #000;box-sizing:border-box}
#bp{right:max(92px,calc(env(safe-area-inset-right) + 92px));bottom:max(22px,env(safe-area-inset-bottom));background:rgba(230,70,40,.45)}
#bk{right:max(16px,env(safe-area-inset-right));bottom:max(64px,calc(env(safe-area-inset-bottom) + 48px));background:rgba(40,130,230,.45)}
#bs{right:max(16px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:64px;height:28px;border-radius:6px;font-size:7px;background:rgba(255,255,255,.12)}
.b.on{filter:brightness(1.8)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="384" height="216" aria-label="Deep Strike game screen"></canvas></div>
<div id="touch"><div id="pad"><div id="knob"></div></div><div class="b" id="bp">P</div><div class="b" id="bk">K</div><div class="b" id="bs">START</div></div>
<script>
'use strict';
(function(){
// ============================================================ CORE
const W=384,H=216,GROUND=194,SW=640,STEP=1000/60,TAU=Math.PI*2,Z=1.45,VW=W/Z,VH=H/Z,CAMY0=GROUND-196/Z;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=window.devicePixelRatio||1;
const RES=Math.max(2,Math.min(4,Math.ceil(Math.min((screen.width||W*3)/W,(screen.height||H*3)/H)*DPR)));
cv.width=W*RES;cv.height=H*RES;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
const R=Math.random;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const mkR=(w,h,sr=RES)=>{const c=mk(Math.ceil(w*sr),Math.ceil(h*sr));c.getContext('2d').scale(sr,sr);return c;};const SRES=Math.min(5,RES*Z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3),eIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const _sh=new Map();
function shade(hex,k){const key=hex+k;let v=_sh.get(key);if(v)return v;const n=parseInt(hex.slice(1),16);const f=x=>clamp(Math.round(k<0?x*(1+k):x+(255-x)*k),0,255);
  v='#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1);_sh.set(key,v);return v;}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a.toFixed(3)+')';}
const BIG='"Bungee",Impact,"Arial Black",sans-serif',SMALL='"Chakra Petch",system-ui,sans-serif';
function text(s,x,y,o={}){const size=o.size||8,big=size>=16,px=big?size:size*1.3;
  ctx.font=(big?'':'700 ')+px+'px '+(big?BIG:SMALL);ctx.textAlign=o.align||'left';ctx.textBaseline='top';
  if(o.outline!==false){ctx.lineJoin='round';ctx.strokeStyle=o.oc||'#000';ctx.lineWidth=big?Math.max(3,size*.17):2.4;ctx.strokeText(s,x,y+(big?size*.07:.7));ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.color||'#fff';ctx.fillText(s,x,y);}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function rrPath(x,y,w,h,r){const P=new Path2D();P.moveTo(x+r,y);P.arcTo(x+w,y,x+w,y+h,r);P.arcTo(x+w,y+h,x,y+h,r);P.arcTo(x,y+h,x,y,r);P.arcTo(x,y,x+w,y,r);P.closePath();return P;}
function disc(c,cx,cy,r,col){c.fillStyle=col;c.beginPath();c.arc(cx,cy,Math.max(.1,r),0,TAU);c.fill();}
function glowDot(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(col,a));g.addColorStop(1,hexA(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}
let VGR=null;function drawVig(){if(!VGR){VGR=ctx.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,W*.62);VGR.addColorStop(0,'rgba(0,0,0,0)');VGR.addColorStop(1,'rgba(0,0,0,.55)');}ctx.fillStyle=VGR;ctx.fillRect(0,0,W,H);}

// ============================================================ INPUT
const keys=new Set(),tapped=new Set();
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period','Enter','Escape','Backspace','Tab']);
addEventListener('keydown',e=>{if(PREVENT.has(e.code)||e.code.startsWith('Numpad'))e.preventDefault();keys.add(e.code);if(!e.repeat)tapped.add(e.code);audioInit();if(e.code==='KeyM'&&!e.repeat)toggleMute();});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
const K1={u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],p:['KeyF','KeyJ'],k:['KeyG','KeyK'],s:['Enter','Space'],x:['Escape','KeyP']};
const K2={u:['ArrowUp'],d:['ArrowDown'],l:['ArrowLeft'],r:['ArrowRight'],p:['Period','Numpad1','Comma'],k:['Slash','Numpad2'],s:['NumpadEnter','ShiftRight'],x:[]};
const touch={u:0,d:0,l:0,r:0,p:0,k:0,s:0,x:0},tlatch={};
const NEUTRAL={u:0,d:0,l:0,r:0,p:0,k:0,s:0,x:0};
function kb(map){const o={};for(const b in map)o[b]=map[b].some(c=>keys.has(c)||tapped.has(c));return o;}
function padState(i){const gps=navigator.getGamepads?navigator.getGamepads():[];const gp=gps&&gps[i];if(!gp)return null;const b=n=>!!(gp.buttons[n]&&gp.buttons[n].pressed);const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  return{u:b(12)||ay<-.5,d:b(13)||ay>.5,l:b(14)||ax<-.5,r:b(15)||ax>.5,p:b(0)||b(2),k:b(1)||b(3),s:b(9),x:b(8)};}
function or(a,b){if(b)for(const k in b)a[k]=a[k]||b[k];return a;}
function readRaw(slot){const solo=G.mode!=='2p';let o;
  if(slot===0){o=kb(K1);if(solo)or(o,kb(K2));or(o,padState(0));if(solo)or(o,padState(1));or(o,touch);or(o,tlatch);}
  else{o=kb(K2);or(o,padState(1));}
  return o;}
const IN=[{cur:{},prev:{}},{cur:{},prev:{}}];
function poll(){for(let s=0;s<2;s++){IN[s].prev=IN[s].cur;IN[s].cur=readRaw(s);}tapped.clear();for(const k in tlatch)delete tlatch[k];}
const btn=(s,b)=>!!(IN[s].cur[b]&&!IN[s].prev[b]);
const anyBtn=(...bs)=>[0,1].some(s=>bs.some(b=>btn(s,b)));
const anyPress=()=>anyBtn('p','k','s');
const HUMAN=[{read:()=>IN[0].cur},{read:()=>IN[1].cur}];

// touch controls
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)document.documentElement.classList.add('touch');
(function(){const pad=document.getElementById('pad'),knob=document.getElementById('knob');let pid=null;
  function setDir(e){const r=pad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy),m=r.width/2-20;
    if(d>m){dx*=m/d;dy*=m/d;}knob.style.transform='translate('+dx+'px,'+dy+'px)';touch.u=touch.d=touch.l=touch.r=0;if(d<14)return;
    const sec=((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8;// 0 r,1 dr,2 d,3 dl,4 l,5 ul,6 u,7 ur
    if(sec===7||sec===0||sec===1)touch.r=1;if(sec>=3&&sec<=5)touch.l=1;if(sec>=1&&sec<=3)touch.d=1;if(sec>=5&&sec<=7)touch.u=1;
    for(const k of['u','d','l','r'])if(touch[k])tlatch[k]=1;}
  function clear(){pid=null;touch.u=touch.d=touch.l=touch.r=0;knob.style.transform='';}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();pid=e.pointerId;try{pad.setPointerCapture(pid);}catch(_){}setDir(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)setDir(e);});
  pad.addEventListener('pointerup',clear);pad.addEventListener('pointercancel',clear);
  for(const[id,k]of[['bp','p'],['bk','k'],['bs','s']]){const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();touch[k]=1;tlatch[k]=1;el.classList.add('on');});
    const up=()=>{touch[k]=0;el.classList.remove('on');};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);}
  cv.addEventListener('pointerdown',()=>{audioInit();if(G.scene!=='fight')tapped.add('Enter');});
})();

// ============================================================ AUDIO
let AC=null,master,mus,sfxG,noiseBuf,muted=false,toastT=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
  mus=AC.createGain();mus.gain.value=.3;mus.connect(master);sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  if(songName)startSong(songName);}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;toastT=90;}
function tone(f,dur,o={}){if(!AC)return;const t=AC.currentTime+Math.max(0,o.when||0);const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+dur);const v=o.vol==null?.2:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  os.connect(g);g.connect(o.dest||sfxG);os.start(t);os.stop(t+dur+.03);}
function noise(dur,o={}){if(!AC)return;const t=AC.currentTime+Math.max(0,o.when||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.value=o.freq||2000;
  const g=AC.createGain();const v=o.vol==null?.3:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(o.dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}
const SFX={
  whiff:()=>noise(.07,{vol:.12,freq:2800,type:'bandpass'}),
  whiffH:()=>noise(.12,{vol:.16,freq:1600,type:'bandpass'}),
  hitL:()=>{noise(.09,{vol:.45,freq:1800});tone(220,.08,{slide:.5,vol:.2});},
  hitH:()=>{noise(.18,{vol:.65,freq:900});tone(130,.18,{slide:.35,vol:.3,type:'sawtooth'});},
  block:()=>{noise(.05,{vol:.3,freq:4500,type:'highpass'});tone(1200,.04,{vol:.08});},
  special:()=>{tone(220,.22,{slide:2.6,vol:.12,type:'sawtooth'});noise(.2,{vol:.12,freq:1200});},
  proj:()=>{tone(160,.35,{slide:3.5,vol:.16,type:'sawtooth'});noise(.3,{vol:.15,freq:700});},
  jump:()=>tone(280,.08,{slide:1.7,vol:.06}),
  land:()=>noise(.05,{vol:.12,freq:400}),
  fall:()=>{noise(.3,{vol:.5,freq:260});tone(90,.25,{slide:.5,vol:.2,type:'triangle'});},
  ko:()=>{tone(110,.9,{slide:.3,vol:.3,type:'sawtooth'});noise(.8,{vol:.5,freq:500});},
  select:()=>tone(660,.05,{vol:.1}),
  confirm:()=>{tone(523,.07,{vol:.13});tone(784,.12,{vol:.13,when:.07});},
  back:()=>tone(330,.08,{vol:.1,slide:.7}),
  super:()=>{[0,4,7,12,16,19,24].forEach((n,i)=>tone(mtof(60+n),.09,{vol:.12,when:i*.035}));noise(.5,{vol:.2,freq:3000,when:.2});},
  round:()=>{tone(mtof(57),.12,{vol:.15});tone(mtof(64),.25,{vol:.15,when:.12});},
  fight:()=>{[57,60,64,69].forEach(n=>tone(mtof(n),.4,{vol:.09,type:'sawtooth'}));noise(.3,{vol:.25,freq:2500});},
  vs:()=>{noise(.6,{vol:.3,freq:1200});tone(80,.6,{slide:.5,vol:.3,type:'sawtooth'});},
  coin:()=>{tone(988,.06,{vol:.12});tone(1319,.25,{vol:.12,when:.06});},
};
function sfx(n){if(SFX[n])SFX[n]();}
function jingle(win){const seq=win?[[72,0],[76,.12],[79,.24],[84,.36],[79,.6],[84,.72]]:[[64,0],[62,.25],[60,.5],[55,.75]];for(const[n,w]of seq)tone(mtof(n),win?.2:.3,{vol:.12,when:w,dest:mus||sfxG});}
const mtof=n=>440*Math.pow(2,(n-69)/12);
const SONGS={
  title:{bpm:108,prog:[45,41,43,40],bass:'x...x.o.x...x.o.',drum:'k.......s.......',lead:'x.....x...x.x...',seed:3},
  crystal:{bpm:136,prog:[50,46,48,45],bass:'x.xo.xo.x.xo.xox',drum:'k.h.s.h.k.hks.h.',lead:'x..x..x.x..x.x..',seed:7},
  borehole:{bpm:146,prog:[40,40,43,38],bass:'xxo.xxo.xxo.xoxo',drum:'k.hhs.hkk.hhs.hh',lead:'x.x...x.x.x.x...',seed:11},
  hollow:{bpm:124,prog:[47,43,45,42],bass:'x..x..x.x..x..o.',drum:'k...s..kk...s...',lead:'x...x.x...x..x..',seed:5},
};
function buildMel(s){const r=rng(s.seed);const tones=[0,3,7,10,12,15,19];s.mel=[];for(let b=0;b<s.prog.length*2;b++)for(let i=0;i<16;i++){
  const on=s.lead[i]==='x'&&r()<.92;s.mel.push(on?s.prog[b%s.prog.length]+24+tones[(r()*tones.length)|0]:0);}}
let songName=null,song=null,step=0,nextT=0;
function startSong(n){songName=n;song=null;if(!AC)return;const s=SONGS[n];if(!s)return;if(!s.mel)buildMel(s);song=s;step=0;nextT=AC.currentTime+.06;}
function stopSong(){songName=null;song=null;}
function playStep(i,w,spb){const s=song,bar=Math.floor(i/16),root=s.prog[bar%s.prog.length],j=i%16;
  const bc=s.bass[j];if(bc!=='.')tone(mtof(root-12+(bc==='o'?12:0)),spb*1.6,{type:'triangle',vol:.28,when:w,dest:mus});
  const m=s.mel[i%s.mel.length];if(m)tone(mtof(m),spb*1.7,{vol:.05,when:w,dest:mus});
  if(s!==SONGS.title){const ch=[0,3,7,12][j%4];tone(mtof(root+12+ch),spb*.6,{vol:.018,when:w,dest:mus});}
  const dc=s.drum[j];if(dc==='k')tone(150,.12,{type:'sine',slide:.3,vol:.45,when:w,dest:mus});
  else if(dc==='s')noise(.12,{vol:.22,freq:1800,type:'bandpass',when:w,dest:mus});
  else if(dc==='h')noise(.03,{vol:.06,freq:7000,type:'highpass',when:w,dest:mus});}
setInterval(()=>{if(!AC||!song||muted)return;const spb=60/song.bpm/4;if(nextT<AC.currentTime-.2)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.15){playStep(step,nextT-AC.currentTime,spb);nextT+=spb;step++;}},25);

// ============================================================ FIGHTER DATA
const RAD=Math.PI/180;
const P={
  idle:{lean:8,fa:[60,-70],ba:[80,-60],fl:[65,95],bl:[120,100]},
  crouch:{lean:20,fa:[55,-62],ba:[75,-55],fl:[18,102],bl:[158,78]},
  jab:{lean:14,fa:[2,-2],ba:[85,-70],fl:[58,95],bl:[125,100],hx:2},
  kickW:{lean:0,fa:[80,-50],ba:[110,-40],fl:[10,105],bl:[100,92]},
  kick:{lean:-20,fa:[100,-40],ba:[125,-20],fl:[-10,-6],bl:[100,92]},
  cjab:{lean:22,fa:[6,4],ba:[80,-60],fl:[18,102],bl:[158,78],hx:2},
  sweep:{lean:45,fa:[95,95],ba:[110,100],fl:[12,4],bl:[170,62]},
  jump:{lean:5,fa:[40,-80],ba:[60,-70],fl:[15,110],bl:[60,130]},
  jpunch:{lean:16,fa:[35,32],ba:[70,-80],fl:[20,110],bl:[60,130]},
  jkick:{lean:-12,fa:[80,-60],ba:[115,-40],fl:[28,32],bl:[70,140]},
  upper:{lean:-6,fa:[-86,-92],ba:[105,-20],fl:[80,95],bl:[130,150]},
  fbW:{lean:-6,fa:[155,115],ba:[165,125],fl:[60,92],bl:[125,100]},
  fb:{lean:14,fa:[-2,-4],ba:[6,0],fl:[50,85],bl:[135,100],hx:2},
  spin:{lean:-4,fa:[150,170],ba:[20,10],fl:[-4,-4],bl:[176,180],lift:10},
  hit:{lean:-24,fa:[150,115],ba:[170,135],fl:[70,95],bl:[115,100]},
  hitC:{lean:-6,fa:[150,115],ba:[170,135],fl:[18,102],bl:[158,78]},
  block:{lean:-4,fa:[35,-95],ba:[52,-100],fl:[65,95],bl:[120,100]},
  cblock:{lean:10,fa:[30,-95],ba:[48,-100],fl:[18,102],bl:[158,78]},
  fall:{lean:-70,fa:[200,215],ba:[190,205],fl:[-25,-10],bl:[-10,10]},
  down:{lean:-88,fa:[185,182],ba:[178,180],fl:[-3,2],bl:[4,0]},
  win:{lean:-6,fa:[-40,-100],ba:[95,-130],fl:[70,90],bl:[115,95]},
};
function walkPose(ph){const s=Math.sin(ph),c=Math.cos(ph);return{lean:10+Math.abs(c)*2,fa:[60+8*s,-70],ba:[80-8*s,-60],fl:[92-26*s,98-20*s+22*Math.max(0,c)],bl:[92+26*s,98+20*s+22*Math.max(0,-c)]};}
function lerpPose(a,b,t){const o={};for(const k of['lean','hx','lift'])o[k]=lerp(a[k]||0,b[k]||0,t);for(const k of['fa','ba','fl','bl'])o[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t)];return o;}

const M={
  lp:{st:4,ac:3,rc:8,dmg:40,hs:15,bs:10,lvl:'mid',limb:'fh',box:[12,10],push:2.6,pose:'jab',from:'idle',cancel:1},
  lk:{st:7,ac:4,rc:15,dmg:85,hs:19,bs:13,lvl:'mid',limb:'ff',box:[16,12],push:4,pose:'kick',wind:'kickW',from:'idle',heavy:1},
  cp:{st:4,ac:3,rc:9,dmg:35,hs:14,bs:9,lvl:'mid',limb:'fh',box:[12,10],push:2.4,pose:'cjab',from:'crouch',crouch:1,cancel:1},
  ck:{st:8,ac:4,rc:20,dmg:70,hs:0,bs:13,lvl:'low',limb:'ff',box:[18,10],push:3,pose:'sweep',from:'crouch',crouch:1,kd:1,heavy:1},
  jp:{st:4,ac:10,rc:6,dmg:65,hs:17,bs:12,lvl:'high',limb:'fh',box:[14,14],push:2,pose:'jpunch',from:'jump',air:1},

  ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.stroke(crest);const tg=ctx.createLinearGradient(0,1,0,34);tg.addColorStop(0,'#4a2a18');tg.addColorStop(1,'#120806');ctx.fillStyle=tg;ctx.fill(crest);
  const gg=ctx.createLinearGradient(0,1,0,34);gg.addColorStop(0,'#fff0a0');gg.addColorStop(.5,'#d8902a');gg.addColorStop(1,'#7a4a10');ctx.strokeStyle=gg;ctx.lineWidth=1.3;ctx.stroke(crest);ctx.restore();
  const low=G.timer<=10&&(G.t>>3)%2;ctx.font='20px '+BIG;ctx.textAlign='center';ctx.textBaseline='top';const ts=String(Math.max(0,G.timer)).padStart(2,'0');
  ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(ts,192,8);const dg=ctx.createLinearGradient(0,9,0,28);dg.addColorStop(0,low?'#ffb0a0':'#ffffff');dg.addColorStop(.5,low?'#ff4030':'#ffe080');dg.addColorStop(1,low?'#a01008':'#e08a18');ctx.fillStyle=dg;ctx.fillText(ts,192,8);
  // names (script) + tags
  const nm=(s,x,al,col)=>{ctx.font='italic 15px "Kaushan Script",cursive';ctx.textAlign=al;ctx.textBaseline='top';ctx.lineJoin='round';ctx.lineWidth=3.4;ctx.strokeStyle='#2a0c06';ctx.strokeText(s,x,21);
    const g=ctx.createLinearGradient(0,22,0,36);g.addColorStop(0,'#ffffff');g.addColorStop(1,col);ctx.fillStyle=g;ctx.fillText(s,x,21);};
  const cap=s=>s[0]+s.slice(1).toLowerCase();nm(cap(a.def.name),40,'left','#ffd8b0');nm(cap(b.def.name),344,'right','#d0e8ff');
  const tag=(s,x,col)=>{ctx.font='700 7px '+SMALL;const w=ctx.measureText(s).width+6;const P=rrPath(x-w/2,1,w,7.5,3.5);ctx.fillStyle=col;ctx.fill(P);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,5);};
  tag(G.mode==='demo'?'CPU':'1P',48,'#c82a1a');tag(G.mode==='2p'?'2P':'CPU',336,'#1a5ac8');
  for(let i=0;i<2;i++){gem(162-i*10,27,a.wins>i);gem(222+i*10,27,b.wins>i);}
  meter(a,10,201,false);meter(b,294,201,true);
  if(toastT>0){toastT--;text(muted?'SOUND OFF':'SOUND ON',W/2,186,{align:'center',color:'#9fe8ff'});}}
function barPath(x,y,w,h,right){const s=6,P=new Path2D();if(!right){P.moveTo(x,y);P.lineTo(x+w,y);P.lineTo(x+w-s*.4,y+h);P.lineTo(x+s,y+h);}else{P.moveTo(x,y);P.lineTo(x+w,y);P.lineTo(x+w-s,y+h);P.lineTo(x+s*.4,y+h);}P.closePath();return P;}
function bar(f,x,y,w,right){const h=10,P=barPath(x,y,w,h,right),O=barPath(x-2,y-2,w+4,h+4,right);
  ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.stroke(O);const fr=ctx.createLinearGradient(0,y-2,0,y+h+2);fr.addColorStop(0,'#fff4b8');fr.addColorStop(.45,'#e0a030');fr.addColorStop(1,'#6a3a08');ctx.fillStyle=fr;ctx.fill(O);
  ctx.save();ctx.clip(P);vgrad(ctx,W,y,y+h,'#2a0808','#0c0202');
  const r=clamp(f.hp/f.def.hp,0,1),rd=clamp(f.dhp/f.def.hp,0,1),low=r<.25;
  const part=(v,g)=>{const ww=v*w,xx=right?x:x+w-ww;ctx.fillStyle=g;ctx.fillRect(xx,y,ww,h);return[xx,ww];};
  let gr=ctx.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#ff7a60');gr.addColorStop(1,'#900c06');part(rd,gr);
  gr=ctx.createLinearGradient(0,y,0,y+h);if(low&&(G.t>>3)%2){gr.addColorStop(0,'#ffb080');gr.addColorStop(1,'#d02a10');}else{gr.addColorStop(0,'#fffbd0');gr.addColorStop(.35,'#ffe040');gr.addColorStop(.7,'#f2b018');gr.addColorStop(1,'#b86a08');}
  const[xx,ww]=part(r,gr);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(xx,y+.8,ww,h*.22);ctx.fillStyle='rgba(120,60,0,.25)';ctx.fillRect(xx,y+h*.72,ww,h*.28);
  const ex=right?xx+ww:xx;ctx.globalCompositeOperation='lighter';glowDot(ctx,ex,y+h/2,6,'#ffffff',.5);ctx.globalCompositeOperation='source-over';
  ctx.restore();ctx.lineWidth=.6;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.stroke(P);}
function gem(x,y,on){ctx.beginPath();ctx.arc(x,y,3.6,0,TAU);ctx.lineWidth=1.8;ctx.strokeStyle='#000';ctx.stroke();
  if(on){const g=ctx.createRadialGradient(x-1.2,y-1.2,0,x,y,4);g.addColorStop(0,'#fff6e0');g.addColorStop(.4,'#ff7a30');g.addColorStop(1,'#801808');ctx.fillStyle=g;ctx.fill();ctx.globalCompositeOperation='lighter';glowDot(ctx,x,y,8,'#ff8040',.45);ctx.globalCompositeOperation='source-over';}
  else{const g=ctx.createRadialGradient(x-1,y-1,0,x,y,4);g.addColorStop(0,'#4a3a38');g.addColorStop(1,'#120a0a');ctx.fillStyle=g;ctx.fill();}}
function meter(f,x,y,right){const w=80,h=7,full=f.meter>=100;
  const panel=right?barPath(x-6,y-3,w+12,h+6,true):barPath(x-6,y-3,w+12,h+6,false);ctx.fillStyle='rgba(6,14,40,.75)';ctx.fill(panel);ctx.lineWidth=1;ctx.strokeStyle='#3a6ad8';ctx.stroke(panel);
  const P=rrPath(x,y,w,h,2);ctx.fillStyle='#050a1c';ctx.fill(P);
  const ww=w*f.meter/100;if(ww>0){ctx.save();ctx.clip(P);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,full?'#e0ffff':'#9ad0ff');g.addColorStop(.5,full?'#30d8ff':'#2a80f0');g.addColorStop(1,full?'#1060ff':'#143a90');ctx.fillStyle=g;ctx.fillRect(right?x+w-ww:x,y,ww,h);
    if(full){const sx=x+((G.t*3)%(w+30))-15;ctx.globalCompositeOperation='lighter';const sg=ctx.createLinearGradient(sx-10,0,sx+10,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.75)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.fillRect(sx-10,y,20,h);ctx.globalCompositeOperation='source-over';}
    ctx.restore();if(full){ctx.globalCompositeOperation='lighter';glowDot(ctx,x+w/2,y+h/2,46,'#40c0ff',.2+.08*Math.sin(G.t*.2));ctx.globalCompositeOperation='source-over';}}
  for(let i=1;i<4;i++){const dx=x+w*i/4;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(dx-.3,y,.6,h);}
  for(let i=0;i<3;i++){const dx=right?x+w-8-i*9:x+8+i*9,on=f.meter>=(i+1)*33.3;ctx.save();ctx.translate(dx,y-5.5);ctx.rotate(Math.PI/4);ctx.fillStyle=on?'#60e0ff':'#1a2a50';ctx.fillRect(-1.8,-1.8,3.6,3.6);ctx.strokeStyle='#000';ctx.lineWidth=.6;ctx.strokeRect(-1.8,-1.8,3.6,3.6);ctx.restore();}
  text(full?'SUPER!':'SUPER',right?x-8:x+w+8,y-1.5,{align:right?'right':'left',color:full?'#80ffff':'#7a8ab0'});}
SC.fight={update:fightUpdate,draw:fightDraw};

// ---------------- result / continue / ending
SC.result={enter(){stopSong();if(G.winner&&(G.mode==='2p'||G.winner.side===0))setTimeout(()=>jingle(true),0);else jingle(false);},
  update(){if(G.t>50&&anyPress()){sfx('confirm');
    if(G.mode==='2p'){go('select');return;}
    if(G.winner&&G.winner.side===0){G.stageNo++;if(G.stageNo>=G.ladder.length){go('ending');return;}G.p2=G.ladder[G.stageNo];go('vs');}
    else go('cont');}},
  draw(){ctx.fillStyle='#0a0810';ctx.fillRect(0,0,W,H);stripes();
    if(!G.winner){text('DRAW GAME',W/2,90,{size:24,align:'center',color:'#ffd040'});return;}
    const i=G.winnerIdx,d=CHARS[i],alt=G.winner.side===1&&G.p1===G.p2;
    drawPuppet(i,92,196,1.75,1,'win',alt,'r');
    const label=G.mode==='2p'?(G.winner.side?'2P':'1P')+' WINS':(G.winner.side===0?'YOU WIN':'YOU LOSE');
    text(label,250,26,{size:16,align:'center',color:G.winner.side?'#50a8ff':'#ff6050'});
    ctx.fillStyle='#000';ctx.fill(rrPath(159,55,214,98,7));const qg=ctx.createLinearGradient(0,56,0,152);qg.addColorStop(0,'#1e2840');qg.addColorStop(1,'#0c1020');ctx.fillStyle=qg;ctx.fill(rrPath(160,56,212,96,6));
    text(d.name,170,64,{color:'#ffd040'});
    const lines=wrap(d.quote.toUpperCase(),30);let shown=Math.floor(G.t*.8);
    lines.forEach((l,k)=>{const s=l.slice(0,Math.max(0,shown));shown-=l.length;text(s,170,82+k*12,{color:'#e8e0d0'});});
    if(G.t>50&&(G.t>>5)%2===0)text('PRESS START',266,170,{align:'center',color:'#9fe8ff'});}};
SC.cont={enter(){G.contN=9;},update(){if(G.t%60===59){G.contN--;sfx('select');if(G.contN<0){go('over');return;}}
    if(G.t>20&&anyBtn('p','s')){sfx('coin');go('vs');}else if(G.t>20&&anyBtn('k')&&G.t%60<50){G.t=59+Math.floor(G.t/60)*60-1;}},
  draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawPuppet(G.p1,W/2,170,1.4,1,'down',false,'c');
    text('CONTINUE?',W/2,40,{size:24,align:'center',color:'#ffd040'});text(String(Math.max(0,G.contN)),W/2,80,{size:32,align:'center',color:'#fff'});
    text('PRESS PUNCH',W/2,184,{align:'center',color:'#8a96a4'});}};
SC.over={enter(){stopSong();jingle(false);},update(){if(G.t>150||(G.t>30&&anyPress()))go('title');},
  draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);text('GAME OVER',W/2,96,{size:24,align:'center',color:'#ff4030'});}};
SC.ending={enter(){startSong('title');},update(){if(G.t>120&&anyPress())go('title');},
  draw(){drawStage(STAGES.borehole,(SW-VW)/2,G.t);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    drawPuppet(G.p1,96,192,1.6,1,'win',false,'e');
    text('CHAMPION',250,24,{size:24,align:'center',color:'#ffd040'});text('OF THE DEEP',250,54,{size:16,align:'center',color:'#ffb020'});
    const L=[CHARS[G.p1].name+' STANDS ALONE','AT THE BOTTOM OF THE','DEEPEST HOLE EVER DUG.','','THE ROCK REMEMBERS.'];
    L.forEach((l,k)=>{if(G.t>40+k*30)text(l,250,92+k*12,{align:'center',color:'#e8e0d0'});});
    if(G.t>120&&(G.t>>5)%2===0)text('PRESS START',250,176,{align:'center',color:'#9fe8ff'});}};
SC.boot={update(){},draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}};

// ============================================================ LOOP
let last=performance.now(),acc=0;
function frameLoop(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){acc-=STEP;poll();G.t++;SC[G.scene].update();}
  ctx.setTransform(RES,0,0,RES,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';SC[G.scene].draw();
  requestAnimationFrame(frameLoop);}
function boot(){STAGES={river:makeStage('river'),crystal:makeStage('crystal'),borehole:makeStage('borehole'),hollow:makeStage('hollow')};go('title');requestAnimationFrame(frameLoop);}
window.__DS=G;
const fontReady=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('20px "Bungee"'),document.fonts.load('700 12px "Chakra Petch"')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontReady.then(boot,boot);
})();
