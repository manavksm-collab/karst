<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="Deep Strike: a retro one-on-one arcade fighter set in caves, crystal grottos and boreholes.">
<meta name="theme-color" content="#07060a">
<title>Deep Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
html.touch #touch{display:block}
#pad{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);pointer-events:none}
.b{position:absolute;width:62px;height:62px;border-radius:50%;pointer-events:auto;touch-action:none;font:10px "Chakra Petch",sans-serif;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);text-shadow:0 1px 0 #000;box-sizing:border-box}
#bp{right:max(92px,calc(env(safe-area-inset-right) + 92px));bottom:max(22px,env(safe-area-inset-bottom));background:rgba(230,70,40,.45)}
#bk{right:max(16px,env(safe-area-inset-right));bottom:max(64px,calc(env(safe-area-inset-bottom) + 48px));background:rgba(40,130,230,.45)}
#bs{right:max(16px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:64px;height:28px;border-radius:6px;font-size:7px;background:rgba(255,255,255,.12)}
.b.on{filter:brightness(1.8)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="384" height="216" aria-label="Deep Strike game screen"></canvas></div>
<div id="touch"><div id="pad"><div id="knob"></div></div><div class="b" id="bp">P</div><div class="b" id="bk">K</div><div class="b" id="bs">START</div></div>
<script>
'use strict';
(function(){
// ============================================================ CORE
const W=384,H=216,GROUND=194,SW=640,STEP=1000/60,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=window.devicePixelRatio||1;
const RES=Math.max(2,Math.min(4,Math.ceil(Math.min((screen.width||W*3)/W,(screen.height||H*3)/H)*DPR)));
cv.width=W*RES;cv.height=H*RES;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
const R=Math.random;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const mkR=(w,h)=>{const c=mk(Math.ceil(w*RES),Math.ceil(h*RES));c.getContext('2d').scale(RES,RES);return c;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3),eIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const _sh=new Map();
function shade(hex,k){const key=hex+k;let v=_sh.get(key);if(v)return v;const n=parseInt(hex.slice(1),16);const f=x=>clamp(Math.round(k<0?x*(1+k):x+(255-x)*k),0,255);
  v='#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1);_sh.set(key,v);return v;}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a.toFixed(3)+')';}
const BIG='"Bungee",Impact,"Arial Black",sans-serif',SMALL='"Chakra Petch",system-ui,sans-serif';
function text(s,x,y,o={}){const size=o.size||8,big=size>=16,px=big?size:size*1.3;
  ctx.font=(big?'':'700 ')+px+'px '+(big?BIG:SMALL);ctx.textAlign=o.align||'left';ctx.textBaseline='top';
  if(o.outline!==false){ctx.lineJoin='round';ctx.strokeStyle=o.oc||'#000';ctx.lineWidth=big?Math.max(3,size*.17):2.4;ctx.strokeText(s,x,y+(big?size*.07:.7));ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.color||'#fff';ctx.fillText(s,x,y);}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function rrPath(x,y,w,h,r){const P=new Path2D();P.moveTo(x+r,y);P.arcTo(x+w,y,x+w,y+h,r);P.arcTo(x+w,y+h,x,y+h,r);P.arcTo(x,y+h,x,y,r);P.arcTo(x,y,x+w,y,r);P.closePath();return P;}
function disc(c,cx,cy,r,col){c.fillStyle=col;c.beginPath();c.arc(cx,cy,Math.max(.1,r),0,TAU);c.fill();}
function glowDot(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(col,a));g.addColorStop(1,hexA(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function wrap(s,n){const out=[];let line='';for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}
let VGR=null;function drawVig(){if(!VGR){VGR=ctx.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,W*.62);VGR.addColorStop(0,'rgba(0,0,0,0)');VGR.addColorStop(1,'rgba(0,0,0,.55)');}ctx.fillStyle=VGR;ctx.fillRect(0,0,W,H);}

// ============================================================ INPUT
const keys=new Set(),tapped=new Set();
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period','Enter','Escape','Backspace','Tab']);
addEventListener('keydown',e=>{if(PREVENT.has(e.code)||e.code.startsWith('Numpad'))e.preventDefault();keys.add(e.code);if(!e.repeat)tapped.add(e.code);audioInit();if(e.code==='KeyM'&&!e.repeat)toggleMute();});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
const K1={u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],p:['KeyF','KeyJ'],k:['KeyG','KeyK'],s:['Enter','Space'],x:['Escape','KeyP']};
const K2={u:['ArrowUp'],d:['ArrowDown'],l:['ArrowLeft'],r:['ArrowRight'],p:['Period','Numpad1','Comma'],k:['Slash','Numpad2'],s:['NumpadEnter','ShiftRight'],x:[]};
const touch={u:0,d:0,l:0,r:0,p:0,k:0,s:0,x:0},tlatch={};
const NEUTRAL={u:0,d:0,l:0,r:0,p:0,k:0,s:0,x:0};
function kb(map){const o={};for(const b in map)o[b]=map[b].some(c=>keys.has(c)||tapped.has(c));return o;}
function padState(i){const gps=navigator.getGamepads?navigator.getGamepads():[];const gp=gps&&gps[i];if(!gp)return null;const b=n=>!!(gp.buttons[n]&&gp.buttons[n].pressed);const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  return{u:b(12)||ay<-.5,d:b(13)||ay>.5,l:b(14)||ax<-.5,r:b(15)||ax>.5,p:b(0)||b(2),k:b(1)||b(3),s:b(9),x:b(8)};}
function or(a,b){if(b)for(const k in b)a[k]=a[k]||b[k];return a;}
function readRaw(slot){const solo=G.mode!=='2p';let o;
  if(slot===0){o=kb(K1);if(solo)or(o,kb(K2));or(o,padState(0));if(solo)or(o,padState(1));or(o,touch);or(o,tlatch);}
  else{o=kb(K2);or(o,padState(1));}
  return o;}
const IN=[{cur:{},prev:{}},{cur:{},prev:{}}];
function poll(){for(let s=0;s<2;s++){IN[s].prev=IN[s].cur;IN[s].cur=readRaw(s);}tapped.clear();for(const k in tlatch)delete tlatch[k];}
const btn=(s,b)=>!!(IN[s].cur[b]&&!IN[s].prev[b]);
const anyBtn=(...bs)=>[0,1].some(s=>bs.some(b=>btn(s,b)));
const anyPress=()=>anyBtn('p','k','s');
const HUMAN=[{read:()=>IN[0].cur},{read:()=>IN[1].cur}];

// touch controls
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)document.documentElement.classList.add('touch');
(function(){const pad=document.getElementById('pad'),knob=document.getElementById('knob');let pid=null;
  function setDir(e){const r=pad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy),m=r.width/2-20;
    if(d>m){dx*=m/d;dy*=m/d;}knob.style.transform='translate('+dx+'px,'+dy+'px)';touch.u=touch.d=touch.l=touch.r=0;if(d<14)return;
    const sec=((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8;// 0 r,1 dr,2 d,3 dl,4 l,5 ul,6 u,7 ur
    if(sec===7||sec===0||sec===1)touch.r=1;if(sec>=3&&sec<=5)touch.l=1;if(sec>=1&&sec<=3)touch.d=1;if(sec>=5&&sec<=7)touch.u=1;
    for(const k of['u','d','l','r'])if(touch[k])tlatch[k]=1;}
  function clear(){pid=null;touch.u=touch.d=touch.l=touch.r=0;knob.style.transform='';}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();pid=e.pointerId;try{pad.setPointerCapture(pid);}catch(_){}setDir(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)setDir(e);});
  pad.addEventListener('pointerup',clear);pad.addEventListener('pointercancel',clear);
  for(const[id,k]of[['bp','p'],['bk','k'],['bs','s']]){const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();touch[k]=1;tlatch[k]=1;el.classList.add('on');});
    const up=()=>{touch[k]=0;el.classList.remove('on');};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);}
  cv.addEventListener('pointerdown',()=>{audioInit();if(G.scene!=='fight')tapped.add('Enter');});
})();

// ============================================================ AUDIO
let AC=null,master,mus,sfxG,noiseBuf,muted=false,toastT=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AC=new C();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
  mus=AC.createGain();mus.gain.value=.3;mus.connect(master);sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  if(songName)startSong(songName);}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;toastT=90;}
function tone(f,dur,o={}){if(!AC)return;const t=AC.currentTime+Math.max(0,o.when||0);const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+dur);const v=o.vol==null?.2:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  os.connect(g);g.connect(o.dest||sfxG);os.start(t);os.stop(t+dur+.03);}
function noise(dur,o={}){if(!AC)return;const t=AC.currentTime+Math.max(0,o.when||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.value=o.freq||2000;
  const g=AC.createGain();const v=o.vol==null?.3:o.vol;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(o.dest||sfxG);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}
const SFX={
  whiff:()=>noise(.07,{vol:.12,freq:2800,type:'bandpass'}),
  whiffH:()=>noise(.12,{vol:.16,freq:1600,type:'bandpass'}),
  hitL:()=>{noise(.09,{vol:.45,freq:1800});tone(220,.08,{slide:.5,vol:.2});},
  hitH:()=>{noise(.18,{vol:.65,freq:900});tone(130,.18,{slide:.35,vol:.3,type:'sawtooth'});},
  block:()=>{noise(.05,{vol:.3,freq:4500,type:'highpass'});tone(1200,.04,{vol:.08});},
  special:()=>{tone(220,.22,{slide:2.6,vol:.12,type:'sawtooth'});noise(.2,{vol:.12,freq:1200});},
  proj:()=>{tone(160,.35,{slide:3.5,vol:.16,type:'sawtooth'});noise(.3,{vol:.15,freq:700});},
  jump:()=>tone(280,.08,{slide:1.7,vol:.06}),
  land:()=>noise(.05,{vol:.12,freq:400}),
  fall:()=>{noise(.3,{vol:.5,freq:260});tone(90,.25,{slide:.5,vol:.2,type:'triangle'});},
  ko:()=>{tone(110,.9,{slide:.3,vol:.3,type:'sawtooth'});noise(.8,{vol:.5,freq:500});},
  select:()=>tone(660,.05,{vol:.1}),
  confirm:()=>{tone(523,.07,{vol:.13});tone(784,.12,{vol:.13,when:.07});},
  back:()=>tone(330,.08,{vol:.1,slide:.7}),
  super:()=>{[0,4,7,12,16,19,24].forEach((n,i)=>tone(mtof(60+n),.09,{vol:.12,when:i*.035}));noise(.5,{vol:.2,freq:3000,when:.2});},
  round:()=>{tone(mtof(57),.12,{vol:.15});tone(mtof(64),.25,{vol:.15,when:.12});},
  fight:()=>{[57,60,64,69].forEach(n=>tone(mtof(n),.4,{vol:.09,type:'sawtooth'}));noise(.3,{vol:.25,freq:2500});},
  vs:()=>{noise(.6,{vol:.3,freq:1200});tone(80,.6,{slide:.5,vol:.3,type:'sawtooth'});},
  coin:()=>{tone(988,.06,{vol:.12});tone(1319,.25,{vol:.12,when:.06});},
};
function sfx(n){if(SFX[n])SFX[n]();}
function jingle(win){const seq=win?[[72,0],[76,.12],[79,.24],[84,.36],[79,.6],[84,.72]]:[[64,0],[62,.25],[60,.5],[55,.75]];for(const[n,w]of seq)tone(mtof(n),win?.2:.3,{vol:.12,when:w,dest:mus||sfxG});}
const mtof=n=>440*Math.pow(2,(n-69)/12);
const SONGS={
  title:{bpm:108,prog:[45,41,43,40],bass:'x...x.o.x...x.o.',drum:'k.......s.......',lead:'x.....x...x.x...',seed:3},
  crystal:{bpm:136,prog:[50,46,48,45],bass:'x.xo.xo.x.xo.xox',drum:'k.h.s.h.k.hks.h.',lead:'x..x..x.x..x.x..',seed:7},
  borehole:{bpm:146,prog:[40,40,43,38],bass:'xxo.xxo.xxo.xoxo',drum:'k.hhs.hkk.hhs.hh',lead:'x.x...x.x.x.x...',seed:11},
  hollow:{bpm:124,prog:[47,43,45,42],bass:'x..x..x.x..x..o.',drum:'k...s..kk...s...',lead:'x...x.x...x..x..',seed:5},
};
function buildMel(s){const r=rng(s.seed);const tones=[0,3,7,10,12,15,19];s.mel=[];for(let b=0;b<s.prog.length*2;b++)for(let i=0;i<16;i++){
  const on=s.lead[i]==='x'&&r()<.92;s.mel.push(on?s.prog[b%s.prog.length]+24+tones[(r()*tones.length)|0]:0);}}
let songName=null,song=null,step=0,nextT=0;
function startSong(n){songName=n;song=null;if(!AC)return;const s=SONGS[n];if(!s)return;if(!s.mel)buildMel(s);song=s;step=0;nextT=AC.currentTime+.06;}
function stopSong(){songName=null;song=null;}
function playStep(i,w,spb){const s=song,bar=Math.floor(i/16),root=s.prog[bar%s.prog.length],j=i%16;
  const bc=s.bass[j];if(bc!=='.')tone(mtof(root-12+(bc==='o'?12:0)),spb*1.6,{type:'triangle',vol:.28,when:w,dest:mus});
  const m=s.mel[i%s.mel.length];if(m)tone(mtof(m),spb*1.7,{vol:.05,when:w,dest:mus});
  if(s!==SONGS.title){const ch=[0,3,7,12][j%4];tone(mtof(root+12+ch),spb*.6,{vol:.018,when:w,dest:mus});}
  const dc=s.drum[j];if(dc==='k')tone(150,.12,{type:'sine',slide:.3,vol:.45,when:w,dest:mus});
  else if(dc==='s')noise(.12,{vol:.22,freq:1800,type:'bandpass',when:w,dest:mus});
  else if(dc==='h')noise(.03,{vol:.06,freq:7000,type:'highpass',when:w,dest:mus});}
setInterval(()=>{if(!AC||!song||muted)return;const spb=60/song.bpm/4;if(nextT<AC.currentTime-.2)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.15){playStep(step,nextT-AC.currentTime,spb);nextT+=spb;step++;}},25);

// ============================================================ FIGHTER DATA
const RAD=Math.PI/180;
const P={
  idle:{lean:8,fa:[60,-70],ba:[80,-60],fl:[65,95],bl:[120,100]},
  crouch:{lean:20,fa:[55,-62],ba:[75,-55],fl:[18,102],bl:[158,78]},
  jab:{lean:14,fa:[2,-2],ba:[85,-70],fl:[58,95],bl:[125,100],hx:2},
  kickW:{lean:0,fa:[80,-50],ba:[110,-40],fl:[10,105],bl:[100,92]},
  kick:{lean:-20,fa:[100,-40],ba:[125,-20],fl:[-10,-6],bl:[100,92]},
  cjab:{lean:22,fa:[6,4],ba:[80,-60],fl:[18,102],bl:[158,78],hx:2},
  sweep:{lean:45,fa:[95,95],ba:[110,100],fl:[12,4],bl:[170,62]},
  jump:{lean:5,fa:[40,-80],ba:[60,-70],fl:[15,110],bl:[60,130]},
  jpunch:{lean:16,fa:[35,32],ba:[70,-80],fl:[20,110],bl:[60,130]},
  jkick:{lean:-12,fa:[80,-60],ba:[115,-40],fl:[28,32],bl:[70,140]},
  upper:{lean:-6,fa:[-86,-92],ba:[105,-20],fl:[80,95],bl:[130,150]},
  fbW:{lean:-6,fa:[155,115],ba:[165,125],fl:[60,92],bl:[125,100]},
  fb:{lean:14,fa:[-2,-4],ba:[6,0],fl:[50,85],bl:[135,100],hx:2},
  spin:{lean:-4,fa:[150,170],ba:[20,10],fl:[-4,-4],bl:[176,180],lift:10},
  hit:{lean:-24,fa:[150,115],ba:[170,135],fl:[70,95],bl:[115,100]},
  hitC:{lean:-6,fa:[150,115],ba:[170,135],fl:[18,102],bl:[158,78]},
  block:{lean:-4,fa:[35,-95],ba:[52,-100],fl:[65,95],bl:[120,100]},
  cblock:{lean:10,fa:[30,-95],ba:[48,-100],fl:[18,102],bl:[158,78]},
  fall:{lean:-70,fa:[200,215],ba:[190,205],fl:[-25,-10],bl:[-10,10]},
  down:{lean:-88,fa:[185,182],ba:[178,180],fl:[-3,2],bl:[4,0]},
  win:{lean:-6,fa:[-40,-100],ba:[95,-130],fl:[70,90],bl:[115,95]},
};
function walkPose(ph){const s=Math.sin(ph),c=Math.cos(ph);return{lean:10+Math.abs(c)*2,fa:[60+8*s,-70],ba:[80-8*s,-60],fl:[92-26*s,98-20*s+22*Math.max(0,c)],bl:[92+26*s,98+20*s+22*Math.max(0,-c)]};}
function lerpPose(a,b,t){const o={};for(const k of['lean','hx','lift'])o[k]=lerp(a[k]||0,b[k]||0,t);for(const k of['fa','ba','fl','bl'])o[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t)];return o;}

const M={
  lp:{st:4,ac:3,rc:8,dmg:40,hs:15,bs:10,lvl:'mid',limb:'fh',box:[12,10],push:2.6,pose:'jab',from:'idle',cancel:1},
  lk:{st:7,ac:4,rc:15,dmg:85,hs:19,bs:13,lvl:'mid',limb:'ff',box:[16,12],push:4,pose:'kick',wind:'kickW',from:'idle',heavy:1},
  cp:{st:4,ac:3,rc:9,dmg:35,hs:14,bs:9,lvl:'mid',limb:'fh',box:[12,10],push:2.4,pose:'cjab',from:'crouch',crouch:1,cancel:1},
  ck:{st:8,ac:4,rc:20,dmg:70,hs:0,bs:13,lvl:'low',limb:'ff',box:[18,10],push:3,pose:'sweep',from:'crouch',crouch:1,kd:1,heavy:1},
  jp:{st:4,ac:10,rc:6,dmg:65,hs:17,bs:12,lvl:'high',limb:'fh',box:[14,14],push:2,pose:'jpunch',from:'jump',air:1},
  jk:{st:5,ac:12,rc:6,dmg:80,hs:19,bs:13,lvl:'high',limb:'ff',box:[16,16],push:2.5,pose:'jkick',from:'jump',air:1,heavy:1},

const SCRIPTS={fb:[[],['d'],['d','f'],['f','p']],dp:[[],['f'],['d'],['d','f','p']],qcb:[[],['d'],['d','b'],['b','k']],su:[[],['d'],['d','f'],['f'],['d'],['d','f'],['f','p']],

// ============================================================ PROJECTILES
function spawnProj(f){const d=f.def.proj,h=f.pts.fh;
  const p={x:f.x+h[0]+f.facing*4,y:GROUND-f.y+h[1],vx:d.vx*f.facing,owner:f,d,t:0,r:d.r};G.projs.push(p);f.proj=p;}
function drawProj(p,cam){const x=p.x-cam,y=p.y,c=p.d.col,t=p.t,dir=Math.sign(p.vx),r=p.r;
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(p.d.style==='orb'){glowDot(ctx,x,y,r*3.2,c[2],.55);glowDot(ctx,x,y,r*1.8,c[1],.9);
    for(let i=0;i<4;i++){const a=t*.3+i*TAU/4;disc(ctx,x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3,1,c[0]);}
    disc(ctx,x+dir,y,r*.65+Math.sin(t*.5)*.4,c[0]);}
  else if(p.d.style==='dart'){glowDot(ctx,x,y,r*3,c[2],.5);const g=ctx.createLinearGradient(x-dir*18,y,x+dir*4,y);g.addColorStop(0,hexA(c[2],0));g.addColorStop(.6,hexA(c[1],.9));g.addColorStop(1,'#ffffff');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+dir*5,y);ctx.quadraticCurveTo(x-dir*4,y-3.2,x-dir*18,y);ctx.quadraticCurveTo(x-dir*4,y+3.2,x+dir*5,y);ctx.fill();disc(ctx,x+dir*1.5,y,1.4,'#fff');}
  else if(p.d.style==='ring'){for(let i=0;i<3;i++){const rr=r*(1-i*.22)+Math.sin(t*.4)*.8;ctx.strokeStyle=hexA(c[i],1-i*.25);ctx.lineWidth=2.2-i*.5;ctx.beginPath();
      ctx.ellipse(x-dir*i*5,y,rr*.7,rr*1.35,0,dir>0?-1.2:Math.PI-1.2,dir>0?1.2:Math.PI+1.2);ctx.stroke();}glowDot(ctx,x,y,r*2.2,c[1],.4);}
  ctx.restore();
  if(p.d.style==='boulder'){ctx.save();ctx.translate(x,y);ctx.rotate(t*.2*dir);const P=polyPath([-r,-2,-5,-r,3,-r+.5,r,-3,r-.5,4,2,r,-5,r-1]);
    ctx.lineJoin='round';ctx.lineWidth=2.2;ctx.strokeStyle=OUTC;ctx.stroke(P);const g=ctx.createRadialGradient(-3,-3,0,0,0,r*1.3);g.addColorStop(0,c[0]);g.addColorStop(.6,c[1]);g.addColorStop(1,c[2]);
    ctx.fillStyle=g;ctx.fill(P);ctx.strokeStyle=c[2];ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-3,-2);ctx.lineTo(1,1);ctx.lineTo(4,0);ctx.stroke();ctx.restore();}}

// ============================================================ STAGES
function vgrad(c,w,y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,y0,w,y1-y0);}
function speckle(c,x,y,w,h,cols,n,r){for(let i=0;i<n;i++){c.globalAlpha=.4+r()*.6;c.fillStyle=cols[(r()*cols.length)|0];c.beginPath();c.ellipse(x+r()*w,y+r()*h,.5+r()*1.6,.4+r()*1,0,0,TAU);c.fill();}c.globalAlpha=1;}
function spike(c,x,y,w,len,col,up,hl){const d=up?-1:1;c.fillStyle=col;c.beginPath();c.moveTo(x-w/2,y);c.quadraticCurveTo(x-w*.18,y+d*len*.55,x,y+d*len);c.quadraticCurveTo(x+w*.22,y+d*len*.5,x+w/2,y);c.closePath();c.fill();
  if(hl){c.strokeStyle=hl;c.lineWidth=.8;c.beginPath();c.moveTo(x-w/2+.6,y);c.quadraticCurveTo(x-w*.18+.4,y+d*len*.55,x,y+d*len);c.stroke();}}
function beam(c,x,y,a,len,w,cols,glow){const dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx,h=w/2,ex=x+dx*len,ey=y+dy*len,tx=x+dx*(len+w*.8),ty=y+dy*(len+w*.8);
  if(glow){c.save();c.globalCompositeOperation='lighter';c.strokeStyle=cols[1];c.globalAlpha=.07;c.lineCap='round';c.lineWidth=w*3.2;c.beginPath();c.moveTo(x,y);c.lineTo(tx,ty);c.stroke();c.restore();}
  c.fillStyle=cols[0];c.beginPath();c.moveTo(x+nx*h,y+ny*h);c.lineTo(ex+nx*h,ey+ny*h);c.lineTo(tx,ty);c.lineTo(ex-nx*h,ey-ny*h);c.lineTo(x-nx*h,y-ny*h);c.closePath();c.fill();
  const s=ny<0?1:-1;c.fillStyle=cols[1];c.beginPath();c.moveTo(x+nx*h*s,y+ny*h*s);c.lineTo(ex+nx*h*s,ey+ny*h*s);c.lineTo(tx,ty);c.lineTo(ex+nx*h*s*.1,ey+ny*h*s*.1);c.lineTo(x+nx*h*s*.1,y+ny*h*s*.1);c.closePath();c.fill();
  c.strokeStyle=cols[2];c.lineWidth=Math.max(.5,w*.12);c.beginPath();c.moveTo(x+nx*h*s*.6,y+ny*h*s*.6);c.lineTo(ex+nx*h*s*.6,ey+ny*h*s*.6);c.stroke();}
function seg(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='butt';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
const STAGE_INFO={crystal:{name:'CRYSTAL GROTTO',song:'crystal'},borehole:{name:'DEEP BOREHOLE',song:'borehole'},hollow:{name:'GLOWWORM HOLLOW',song:'hollow'}};
const WF=Math.ceil(W+(SW-W)*.3),WM=Math.ceil(W+(SW-W)*.6);
function makeStage(id){
  const r=rng(id.length*977+id.charCodeAt(0)*13),far=mkR(WF,H),mid=mkR(WM,H),near=mkR(SW,H);
  const f=far.getContext('2d'),m=mid.getContext('2d'),n=near.getContext('2d');
  const st={id,far,mid,near,crowd:[],ledge:150,glints:[],lamps:[],stars:[],name:STAGE_INFO[id].name,song:STAGE_INFO[id].song,reflect:id!=='borehole'};
  if(id==='crystal'){
    vgrad(f,WF,0,H,'#04101a','#0f3242');speckle(f,0,0,WF,H,['#0a1a24','#14384a','#081620'],700,r);
    for(let i=0;i<14;i++)beam(f,r()*WF,40+r()*110,(r()-.5)*1.2+(r()<.5?0:Math.PI),60+r()*120,3+r()*2,['#143642','#1f5466','#3d8090'],1);
    for(let x=0;x<WF;x+=5+r()*8)spike(f,x,0,5+r()*9,10+r()*32,'#040b12');
    for(const side of[0,1]){m.fillStyle='#081a24';m.beginPath();m.moveTo(side?WM:0,0);for(let y=0;y<=H;y+=6){const w=40+Math.sin(y*.05+side*2)*14+r()*5;m.lineTo(side?WM-w:w,y);}m.lineTo(side?WM:0,H);m.closePath();m.fill();}
    for(let i=0;i<8;i++){const x=40+r()*(WM-80),y=60+r()*90,a=-Math.PI/2+(r()-.5)*2.2;beam(m,x,y,a,70+r()*150,8+r()*8,['#1d6f86','#72d4e8','#f0ffff'],1);st.glints.push([x+Math.cos(a)*50,y+Math.sin(a)*50]);}
    for(let x=0;x<WM;x+=6+r()*10)spike(m,x,0,6+r()*11,12+r()*38,'#061219',false,'#1a4658');
    vgrad(m,WM,st.ledge,st.ledge+14,'#123040','#071820');seg(m,0,st.ledge+.5,WM,st.ledge+.5,1,'#3a7484');
    vgrad(n,SW,164,H,'#1e4250','#06141c');seg(n,0,164.5,SW,164.5,1.2,'#5aa0b0');speckle(n,0,166,SW,50,['#183644','#2a5a68','#0c1e26'],500,r);
    for(let i=0;i<28;i++){const x=r()*SW;beam(n,x,169+r()*5,-Math.PI/2+(r()-.5)*.9,5+r()*10,2.5+r()*1.5,['#2a8aa0','#86e0f0','#ffffff']);}
    st.crowdCol=['#0e2634','#123446','#0a1e2a'];st.fog='#3aa0c0';
  }else if(id==='borehole'){
    vgrad(f,WF,0,H,'#120905','#2e1a0e');speckle(f,0,0,WF,H,['#1c0f08','#2e1a0e','#0e0704'],700,r);
    for(let x=10;x<WF;x+=48)rect(f,x,20,4,140,'#1e120a');rect(f,0,60,WF,3,'#1e120a');rect(f,0,110,WF,3,'#1e120a');
    for(let i=0;i<14;i++){const x=r()*WF,y=30+r()*100;glowDot(f,x,y,10,'#ff9a40',.35);disc(f,x,y,1.2,'#ffe0a0');}
    const S='#3b2a1f',SL='#7a5a3e';
    for(let x=8;x<WM;x+=64){const g=m.createLinearGradient(x,0,x+7,0);g.addColorStop(0,SL);g.addColorStop(.3,'#4e3828');g.addColorStop(1,'#24180f');m.fillStyle=g;m.fillRect(x,0,7,st.ledge);}
    for(const y of[40,96]){vgrad(m,WM,y,y+6,'#6a4a32','#24180f');for(let x=4;x<WM;x+=10)disc(m,x,y+3,.7,'#a07a50');}
    for(let x=8;x<WM-64;x+=64){seg(m,x+7,46,x+64,96,2,'#33241a');seg(m,x+7,102,x+64,st.ledge,2,'#33241a');}
    const cx=WM/2;m.lineCap='round';for(const s of[-1,1]){seg(m,cx+s*24,0,cx+s*(24+st.ledge*.35),st.ledge,4,'#4e3628');seg(m,cx+s*24-s*1,0,cx+s*(24+st.ledge*.35)-s,st.ledge,1,'#8a6440');}
    for(let y=0;y<st.ledge;y+=16){const w0=24+y*.35,w1=24+(y+16)*.35;seg(m,cx-w0,y,cx+w0,y,2,'#4a3426');seg(m,cx-w0,y,cx+w1,y+16,1.2,'#3a281c');seg(m,cx+w0,y,cx-w1,y+16,1.2,'#3a281c');}
    m.fillStyle='#e0b020';m.fill(rrPath(cx-28,57,56,18,3));m.fillStyle='#1e130a';m.fill(rrPath(cx-26,59,52,14,2));
    m.font='10px '+BIG;m.textAlign='center';m.textBaseline='middle';m.fillStyle='#f4c838';m.fillText('12262M',cx,66.5);
    for(let y=120;y<st.ledge;y+=6)vgrad(m,WM,y,y+3,'#6a584a','#2e241e');
    rect(m,0,st.ledge,WM,12,'#2a1e16');m.save();m.beginPath();m.rect(0,st.ledge,WM,3.5);m.clip();rect(m,0,st.ledge,WM,3.5,'#181008');m.fillStyle='#e0b020';for(let x=-8;x<WM;x+=9){m.beginPath();m.moveTo(x,st.ledge+3.5);m.lineTo(x+4.5,st.ledge);m.lineTo(x+9,st.ledge);m.lineTo(x+4.5,st.ledge+3.5);m.fill();}m.restore();
    vgrad(n,SW,164,H,'#3a2e26','#100b08');for(let x=0;x<SW;x+=32){seg(n,x+.5,167,x+.5,H,1,'#1a1411');for(let y=172;y<H;y+=12){disc(n,x+4,y,.8,'#6a5a4e');disc(n,x+28,y,.8,'#6a5a4e');}}
    n.save();n.beginPath();n.rect(0,164,SW,3.5);n.clip();rect(n,0,164,SW,3.5,'#1a120a');n.fillStyle='#e0b020';for(let x=-8;x<SW;x+=10){n.beginPath();n.moveTo(x,167.5);n.lineTo(x+5,164);n.lineTo(x+10,164);n.lineTo(x+5,167.5);n.fill();}n.restore();
    speckle(n,0,170,SW,46,['#4a3e34','#241c16'],300,r);
    for(let i=0;i<7;i++)st.lamps.push({x:40+i*(WM-80)/6,len:20+r()*30,ph:r()*6});
    st.crowdCol=['#2a1a10','#341f14','#1e120a'];st.crowdLamp=1;st.fog='#a05a20';
  }else{
    vgrad(f,WF,0,H,'#010307','#08161f');speckle(f,0,0,WF,H,['#030810','#08141e'],500,r);
    for(let i=0;i<170;i++){const x=r()*WF,len=4+r()*34;seg(f,x,0,x,len,.5,'rgba(120,200,230,.18)');st.stars.push({x,y:len+1,ph:r()*6,sp:.02+r()*.05});}
    for(let x=0;x<WM;x+=8+r()*16)spike(m,x,0,9+r()*16,18+r()*60,'#060d14',false,'#16304a');
    for(let x=0;x<WM;x+=14+r()*30)spike(m,x,st.ledge+2,9+r()*12,10+r()*30,'#060d14',true,'#18344a');
    vgrad(m,WM,st.ledge,st.ledge+14,'#0a2638','#04121c');for(let i=0;i<60;i++){const x=r()*WM,y=st.ledge+2+r()*10;seg(m,x,y,x+4+r()*10,y,.6,'#1a4a64');}
    vgrad(n,SW,164,H,'#1a2630','#080e12');seg(n,0,164.5,SW,164.5,1,'#3e5a6c');speckle(n,0,166,SW,50,['#121c24','#26384a'],500,r);
    for(let i=0;i<10;i++){const x=r()*SW,y=172+r()*36,w=14+r()*30;const g=n.createLinearGradient(0,y-2,0,y+2);g.addColorStop(0,'#2a5a70');g.addColorStop(1,'#10222c');n.fillStyle=g;n.beginPath();n.ellipse(x,y,w/2,2.2,0,0,TAU);n.fill();seg(n,x-w*.3,y-1,x+w*.05,y-1,.6,'#7ad0f0');}
    st.crowdCol=['#0a1822','#0e2030','#08141c'];st.fog='#2a7aa8';
  }
  const cr=rng(id.length*31+7);for(let x=12;x<WM-12;x+=9+cr()*14){if(id==='borehole'&&Math.abs(x-WM/2)<40)continue;st.crowd.push({x,h:14+cr()*6,c:st.crowdCol[(cr()*3)|0],ph:cr()*6});}
  return st;
}
let STAGES={};
function drawStage(st,cam,t){
  const cf=cam*.3,cm=cam*.6;
  ctx.drawImage(st.far,-cf,0,WF,H);
  if(st.id==='hollow'){ctx.globalCompositeOperation='lighter';for(const s of st.stars){const a=(Math.sin(t*s.sp+s.ph)+1)/2;const x=s.x-cf;if(x<-4||x>W+4)continue;glowDot(ctx,x,s.y,2.6,'#3fc8ff',.25+a*.4);disc(ctx,x,s.y,.55,a>.75?'#d8faff':'#5fd8ff');}ctx.globalCompositeOperation='source-over';}
  ctx.drawImage(st.mid,-cm,0,WM,H);
  if(st.id==='crystal'){ctx.globalCompositeOperation='lighter';
    for(let i=0;i<4;i++){const x=i*150+Math.sin(t*.004+i)*30-cm*.5;const g=ctx.createLinearGradient(0,0,0,170);g.addColorStop(0,'rgba(120,230,255,.1)');g.addColorStop(1,'rgba(120,230,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+26,0);ctx.lineTo(x-20,170);ctx.lineTo(x-80,170);ctx.fill();}
    for(let i=0;i<st.glints.length;i++){const gl=st.glints[i],k=(t+i*40)%160;if(k<14){const x=gl[0]-cm,y=gl[1],L=(k<7?k:14-k)*1.2;glowDot(ctx,x,y,L*1.6,'#bff6ff',.6);seg(ctx,x-L,y,x+L,y,.8,'#fff');seg(ctx,x,y-L,x,y+L,.8,'#fff');}}
    ctx.globalCompositeOperation='source-over';}
  if(st.id==='borehole')for(const l of st.lamps){const a=Math.sin(t*.03+l.ph)*.25,x0=l.x-cm,ex=x0+Math.sin(a)*l.len,ey=Math.cos(a)*l.len;
    seg(ctx,x0,0,ex,ey,.8,'#1a120c');ctx.globalCompositeOperation='lighter';glowDot(ctx,ex,ey+3,22,'#ffb050',.32+.05*Math.sin(t*.3+l.ph));ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#3a2a1a';ctx.fill(rrPath(ex-3.2,ey-1,6.4,3,1));disc(ctx,ex,ey+3,2.3,'#fff2c8');}
  if(st.id==='hollow'){ctx.globalCompositeOperation='lighter';for(let i=0;i<16;i++){const x=((i*53+t*.4)%WM)-cm,y=st.ledge+3+(i*7)%10;seg(ctx,x,y,x+3+(i%3)*2.5,y,.8,'rgba(90,180,220,.5)');}ctx.globalCompositeOperation='source-over';
    const bt=t%900;if(bt<300){ctx.strokeStyle='#05080c';ctx.lineWidth=1;ctx.lineCap='round';for(let i=0;i<4;i++){const bx=bt*1.6-40+i*14-cm*.2,by=50+i*7+Math.sin(bt*.1+i)*5,fl=Math.sin(bt*.6+i)*2.5;
      ctx.beginPath();ctx.moveTo(bx-4,by-fl);ctx.quadraticCurveTo(bx-2,by-1,bx,by);ctx.quadraticCurveTo(bx+2,by-1,bx+4,by-fl);ctx.stroke();}}}
  // crowd
  const ch=G.cheer||0;
  for(let i=0;i<st.crowd.length;i++){const p=st.crowd[i],x=p.x-cm,b=Math.abs(Math.sin(t*(.12+ch*.01)+p.ph))*(1+ch*.5),y=st.ledge-b;
    if(x<-10||x>W+10)continue;ctx.fillStyle=p.c;ctx.fill(rrPath(x-3.8,y-p.h+5,7.6,p.h-5,2.5));disc(ctx,x,y-p.h+2.3,2.8,p.c);
    if(ch>1&&i%3===0){ctx.strokeStyle=p.c;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-3,y-p.h+6);ctx.lineTo(x-5,y-p.h-1+(i%2)*2);ctx.moveTo(x+3,y-p.h+6);ctx.lineTo(x+5,y-p.h-1+((i+1)%2)*2);ctx.stroke();}
    if(st.crowdLamp&&i%2===0){disc(ctx,x+1.2,y-p.h+1,1,'#fff2b0');ctx.globalCompositeOperation='lighter';glowDot(ctx,x+1.5,y-p.h+1,5,'#ffd070',.35);ctx.globalCompositeOperation='source-over';}}
  const fg=ctx.createLinearGradient(0,110,0,172);fg.addColorStop(0,hexA(st.fog,0));fg.addColorStop(.7,hexA(st.fog,.16));fg.addColorStop(1,hexA(st.fog,0));ctx.fillStyle=fg;ctx.fillRect(0,110,W,62);
  ctx.drawImage(st.near,-cam,0,SW,H);
  if(st.id==='crystal'&&G.parts&&t%23===0)G.parts.push({type:'drip',x:G.cam+R()*W,y:-4,vx:0,vy:3,life:90,max:90,g:.12});
}

// ============================================================ GAME STATE
const G={scene:'boot',t:0,mode:'arcade',parts:[],projs:[],cam:SW/2-W/2,cheer:0,menu:0,sub:'press',idle:0,cur:[0,1],lock:[false,false],ladder:[],stageNo:0,p1:0,p2:1,f:[],round:0};
const PUP=[];
const SC={};
function go(s){G.scene=s;G.t=0;if(SC[s].enter)SC[s].enter();}
function puppet(i,alt,tag=''){const k=i+(alt?'a':'')+tag;if(!PUP[k])PUP[k]=new Fighter(prepDef(CHARS[i],alt),0,null);return PUP[k];}
function drawPuppet(i,x,y,sc,facing,state,alt,tag){const f=puppet(i,alt,tag);f.facing=facing;if(f.state!==state){f.state=state;f.t=0;}f.t++;f.calc();
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.save();ctx.scale(1,.32);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,16*f.def.scale,8,0,0,TAU);ctx.fill();ctx.restore();
  renderGroups(ctx,buildOps(f.def,f.pts,f.facing,G.t,f),'normal');ctx.restore();}
function banner(textS,size,color,life=60,y=80){G.banner={text:textS,size,color,life,max:life,y};}

// ---------------- title
const MENU=['ARCADE','VERSUS','HOW TO PLAY'];
SC.title={
  enter(){G.sub='press';G.menu=0;G.idle=0;G.mode='arcade';startSong('title');},
  update(){G.idle++;
    if(G.sub==='press'){if(anyPress()){G.sub='menu';sfx('coin');G.idle=0;}if(G.idle>60*18)startDemo();return;}
    if(btn(0,'u')||btn(1,'u')){G.menu=(G.menu+MENU.length-1)%MENU.length;sfx('select');G.idle=0;}
    if(btn(0,'d')||btn(1,'d')){G.menu=(G.menu+1)%MENU.length;sfx('select');G.idle=0;}
    if(anyBtn('p','s')){sfx('confirm');if(G.menu===0){G.mode='arcade';go('select');}else if(G.menu===1){G.mode='2p';go('select');}else go('howto');}
    if(anyBtn('k','x')){G.sub='press';sfx('back');}
    if(G.idle>60*30)startDemo();},
  draw(){drawStage(STAGES.crystal,(SW-W)/2+Math.sin(G.t*.004)*120,G.t);drawVig();ctx.fillStyle='rgba(4,6,12,.45)';ctx.fillRect(0,0,W,H);
    drawLogo(W/2,24);
    text('BRAWL AT THE BOTTOM OF THE WORLD',W/2,104,{align:'center',color:'#9fe8ff'});
    if(G.sub==='press'){if((G.t>>5)%2===0)text('PRESS START',W/2,134,{align:'center',size:8,color:'#fff'});
      text('ENTER / TAP / GAMEPAD START',W/2,150,{align:'center',color:'#7a8a9a'});}
    else{for(let i=0;i<MENU.length;i++){const sel=i===G.menu;text((sel?'> ':'  ')+MENU[i]+(sel?' <':'  '),W/2,122+i*16,{align:'center',color:sel?'#ffd040':'#8a96a4'});}}
    text('(C) 2026 KARST ARCADE   M: SOUND',W/2,200,{align:'center',color:'#566270'});}
};

  ctx.save();ctx.translate(sx,sy);
  drawStage(G.stage,G.cam,G.t);
  if(G.freeze>0){const fb=G.freezeBy;ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(-4,-4,W+8,H+8);
    const cx=fb.x-G.cam,cy=GROUND-fb.y-30;ctx.strokeStyle=fb.def.col.acc;ctx.globalAlpha=.6;ctx.lineWidth=1;
    for(let i=0;i<28;i++){const an=i/28*Math.PI*2+G.t*.02,r0=30+((G.t*4+i*13)%30);ctx.beginPath();ctx.moveTo(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0);ctx.lineTo(cx+Math.cos(an)*(r0+60),cy+Math.sin(an)*(r0+60));ctx.stroke();}ctx.globalAlpha=1;}
  drawShadow(a);drawShadow(b);
  const order=(a.state==='attack'&&b.state!=='attack')?[b,a]:[a,b];
  for(const f of order)drawFighter(f);
  for(const p of G.projs)drawProj(p,G.cam);
  drawParts(G.cam);
  ctx.restore();
  drawVig();
  if(G.freeze>0){const fb=G.freezeBy,k=Math.min(1,(50-G.freeze)/8);const y=96;const bg=ctx.createLinearGradient(0,y,0,y+24);bg.addColorStop(0,shade(fb.def.col.acc,.3));bg.addColorStop(1,shade(fb.def.col.acc,-.35));ctx.fillStyle=bg;ctx.globalAlpha=.9;ctx.fillRect(0,y,W*k,24);ctx.globalAlpha=1;rect(ctx,0,y,W*k,1,'#fff');rect(ctx,0,y+23,W*k,1,'#fff');
    text(fb.def.sp.su+'!',fb.side?W-12-(1-k)*200:12+(1-k)*-200,y+2,{size:16,color:'#fff',align:fb.side?'right':'left'});}
  drawHUD();
  if(G.banner){const bn=G.banner,u=1-bn.life/bn.max,pop=u<.1?u/.1:1,s=bn.size*(pop<1?1.6-pop*.6:1);ctx.globalAlpha=Math.min(1,bn.life/8);
    text(bn.text,W/2,bn.y-s/2,{size:s,color:bn.color,align:'center'});ctx.globalAlpha=1;}
  if(G.perfect)text('PERFECT',W/2,58,{size:16,align:'center',color:(G.t>>2)%2?'#ffd040':'#ffffff'});
  if(G.combo&&G.combo.n>=2){const x=G.combo.side?W-10:10,al=G.combo.side?'right':'left';text(G.combo.n+' HITS',x,60,{size:16,align:al,color:'#ffd040'});text('COMBO!',x,78,{align:al,color:'#ff8040'});}
  if(G.mode==='demo'){rect(ctx,0,H-30,W,14,'rgba(0,0,0,.5)');if((G.t>>5)%2===0)text('DEMO PLAY - PRESS START',W/2,H-27,{align:'center',color:'#ffd040'});}
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);text('PAUSED',W/2,70,{size:24,align:'center',color:'#ffd040'});
    for(let i=0;i<PMENU.length;i++){const s=i===G.pmenu;text((s?'> ':'')+PMENU[i]+(s?' <':''),W/2,112+i*16,{align:'center',color:s?'#fff':'#8a96a4'});}}
}
function drawHUD(){const[a,b]=G.f;
  bar(a,10,8,160,false);bar(b,214,8,160,true);
  const tb=rrPath(174,3,36,26,5);ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.stroke(tb);const tg=ctx.createLinearGradient(0,3,0,29);tg.addColorStop(0,'#3a2c48');tg.addColorStop(1,'#0c0812');ctx.fillStyle=tg;ctx.fill(tb);ctx.lineWidth=.8;ctx.strokeStyle='#d8b060';ctx.stroke(tb);
  text(String(Math.max(0,G.timer)).padStart(2,'0'),192,7,{size:18,align:'center',color:G.timer<=10&&(G.t>>3)%2?'#ff4030':'#ffd040'});
  text(a.def.name,12,21,{size:9,color:'#fff'});text(b.def.name,372,21,{size:9,align:'right',color:'#fff'});
  for(let i=0;i<2;i++){gem(16+i*11,38,a.wins>i);gem(368-i*11,38,b.wins>i);}
  meter(a,12,201,false);meter(b,292,201,true);
  if(G.mode==='2p'){text('1P',12,186,{color:'#ff6050'});text('2P',372,186,{align:'right',color:'#50a8ff'});}
  else if(G.mode==='arcade')text('CPU',372,186,{align:'right',color:'#8a96a4'});
  if(toastT>0){toastT--;text(muted?'SOUND OFF':'SOUND ON',W/2,186,{align:'center',color:'#9fe8ff'});}}
function barPath(x,y,w,h,right){const s=5,P=new Path2D();if(!right){P.moveTo(x+s,y);P.lineTo(x+w,y);P.lineTo(x+w,y+h);P.lineTo(x,y+h);}else{P.moveTo(x,y);P.lineTo(x+w-s,y);P.lineTo(x+w,y+h);P.lineTo(x,y+h);}P.closePath();return P;}
function bar(f,x,y,w,right){const h=11,P=barPath(x,y,w,h,right);
  ctx.lineJoin='round';ctx.lineWidth=3.2;ctx.strokeStyle='#000';ctx.stroke(P);ctx.save();ctx.clip(P);
  vgrad(ctx,W,y,y+h,'#3a0a0a','#120303');
  const r=clamp(f.hp/f.def.hp,0,1),rd=clamp(f.dhp/f.def.hp,0,1),low=r<.25;
  const part=(v,g)=>{const ww=v*w,xx=right?x:x+w-ww;ctx.fillStyle=g;ctx.fillRect(xx,y,ww,h);return[xx,ww];};
  let gr=ctx.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#ff6a50');gr.addColorStop(1,'#a01008');part(rd,gr);
  gr=ctx.createLinearGradient(0,y,0,y+h);if(low&&(G.t>>3)%2){gr.addColorStop(0,'#ffb080');gr.addColorStop(1,'#e03a20');}else{gr.addColorStop(0,'#fff8b0');gr.addColorStop(.45,'#ffd23a');gr.addColorStop(1,'#e88a10');}
  const[xx,ww]=part(r,gr);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(xx,y+1,ww,h*.3);
  ctx.restore();ctx.lineWidth=.8;ctx.strokeStyle='#d8b060';ctx.stroke(P);}
function gem(x,y,on){ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.stroke();
  if(on){const g=ctx.createRadialGradient(x-1.3,y-1.3,0,x,y,4.5);g.addColorStop(0,'#fffbe0');g.addColorStop(.5,'#ffd040');g.addColorStop(1,'#b06a08');ctx.fillStyle=g;ctx.fill();ctx.globalCompositeOperation='lighter';glowDot(ctx,x,y,8,'#ffc040',.35);ctx.globalCompositeOperation='source-over';}
  else{ctx.fillStyle='#22222e';ctx.fill();}}
function meter(f,x,y,right){const w=80,h=6,full=f.meter>=100,P=rrPath(x,y,w,h,3);ctx.lineWidth=2.4;ctx.strokeStyle='#000';ctx.stroke(P);ctx.fillStyle='#0c1428';ctx.fill(P);
  const ww=w*f.meter/100;if(ww>0){ctx.save();ctx.clip(P);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,full?'#c0ffff':'#80c0ff');g.addColorStop(.5,full?'#30c8ff':'#2a70e0');g.addColorStop(1,full?'#1070ff':'#183c90');ctx.fillStyle=g;ctx.fillRect(right?x+w-ww:x,y,ww,h);
    if(full){const sx=x+((G.t*3)%(w+30))-15;ctx.globalCompositeOperation='lighter';const sg=ctx.createLinearGradient(sx-10,0,sx+10,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.7)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.fillRect(sx-10,y,20,h);ctx.globalCompositeOperation='source-over';}
    ctx.restore();if(full){ctx.globalCompositeOperation='lighter';glowDot(ctx,x+w/2,y+h/2,46,'#40c0ff',.18+.08*Math.sin(G.t*.2));ctx.globalCompositeOperation='source-over';}}
  ctx.lineWidth=.7;ctx.strokeStyle='#6a8ac0';ctx.stroke(P);
  text(full?'SUPER!':'SUPER',right?x-4:x+w+4,y-2.5,{align:right?'right':'left',color:full?'#80ffff':'#5a6a8a'});}
SC.fight={update:fightUpdate,draw:fightDraw};

// ---------------- result / continue / ending
SC.result={enter(){stopSong();if(G.winner&&(G.mode==='2p'||G.winner.side===0))setTimeout(()=>jingle(true),0);else jingle(false);},
  update(){if(G.t>50&&anyPress()){sfx('confirm');
    if(G.mode==='2p'){go('select');return;}
    if(G.winner&&G.winner.side===0){G.stageNo++;if(G.stageNo>=G.ladder.length){go('ending');return;}G.p2=G.ladder[G.stageNo];go('vs');}
    else go('cont');}},
  draw(){ctx.fillStyle='#0a0810';ctx.fillRect(0,0,W,H);stripes();
    if(!G.winner){text('DRAW GAME',W/2,90,{size:24,align:'center',color:'#ffd040'});return;}
    const i=G.winnerIdx,d=CHARS[i],alt=G.winner.side===1&&G.p1===G.p2;
    drawPuppet(i,92,196,1.75,1,'win',alt,'r');
    const label=G.mode==='2p'?(G.winner.side?'2P':'1P')+' WINS':(G.winner.side===0?'YOU WIN':'YOU LOSE');
    text(label,250,26,{size:16,align:'center',color:G.winner.side?'#50a8ff':'#ff6050'});
    ctx.fillStyle='#000';ctx.fill(rrPath(159,55,214,98,7));const qg=ctx.createLinearGradient(0,56,0,152);qg.addColorStop(0,'#1e2840');qg.addColorStop(1,'#0c1020');ctx.fillStyle=qg;ctx.fill(rrPath(160,56,212,96,6));
    text(d.name,170,64,{color:'#ffd040'});
    const lines=wrap(d.quote.toUpperCase(),30);let shown=Math.floor(G.t*.8);
    lines.forEach((l,k)=>{const s=l.slice(0,Math.max(0,shown));shown-=l.length;text(s,170,82+k*12,{color:'#e8e0d0'});});
    if(G.t>50&&(G.t>>5)%2===0)text('PRESS START',266,170,{align:'center',color:'#9fe8ff'});}};
SC.cont={enter(){G.contN=9;},update(){if(G.t%60===59){G.contN--;sfx('select');if(G.contN<0){go('over');return;}}
    if(G.t>20&&anyBtn('p','s')){sfx('coin');go('vs');}else if(G.t>20&&anyBtn('k')&&G.t%60<50){G.t=59+Math.floor(G.t/60)*60-1;}},
  draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawPuppet(G.p1,W/2,170,1.4,1,'down',false,'c');
    text('CONTINUE?',W/2,40,{size:24,align:'center',color:'#ffd040'});text(String(Math.max(0,G.contN)),W/2,80,{size:32,align:'center',color:'#fff'});
    text('PRESS PUNCH',W/2,184,{align:'center',color:'#8a96a4'});}};
SC.over={enter(){stopSong();jingle(false);},update(){if(G.t>150||(G.t>30&&anyPress()))go('title');},
  draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);text('GAME OVER',W/2,96,{size:24,align:'center',color:'#ff4030'});}};
SC.ending={enter(){startSong('title');},update(){if(G.t>120&&anyPress())go('title');},
  draw(){drawStage(STAGES.borehole,(SW-W)/2,G.t);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    drawPuppet(G.p1,96,192,1.6,1,'win',false,'e');
    text('CHAMPION',250,24,{size:24,align:'center',color:'#ffd040'});text('OF THE DEEP',250,54,{size:16,align:'center',color:'#ffb020'});
    const L=[CHARS[G.p1].name+' STANDS ALONE','AT THE BOTTOM OF THE','DEEPEST HOLE EVER DUG.','','THE ROCK REMEMBERS.'];
    L.forEach((l,k)=>{if(G.t>40+k*30)text(l,250,92+k*12,{align:'center',color:'#e8e0d0'});});
    if(G.t>120&&(G.t>>5)%2===0)text('PRESS START',250,176,{align:'center',color:'#9fe8ff'});}};
SC.boot={update(){},draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}};

// ============================================================ LOOP
let last=performance.now(),acc=0;
function frameLoop(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){acc-=STEP;poll();G.t++;SC[G.scene].update();}
  ctx.setTransform(RES,0,0,RES,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';SC[G.scene].draw();
  requestAnimationFrame(frameLoop);}
function boot(){STAGES={crystal:makeStage('crystal'),borehole:makeStage('borehole'),hollow:makeStage('hollow')};go('title');requestAnimationFrame(frameLoop);}
window.__DS=G;
const fontReady=document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('20px "Bungee"'),document.fonts.load('700 12px "Chakra Petch"')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontReady.then(boot,boot);
})();
</script>
